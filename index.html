<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Điểm Sinh Viên</title>
    <link rel="stylesheet" href="style_dvsv.css">
</head>
<body>

    <div class="table-container">
        <div class="table-label">BẢNG ĐIỂM</div>

        <table>
            <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Họ và tên sinh viên</th>
                    <th class="col-score">Điểm số</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-stt">1</td>
                    <td>Nguyễn Văn A</td>
                    <td class="col-score">8.5</td>
                </tr>
                <tr>
                    <td class="col-stt">2</td>
                    <td>Nguyễn Văn B</td>
                    <td class="col-score">9.0</td>
                </tr>
                <tr>
                    <td class="col-stt">3</td>
                    <td>Nguyễn Văn C</td>
                    <td class="col-score">7.2</td>
                </tr>
                <tr>
                    <td class="col-stt">4</td>
                    <td>Nguyễn Văn D</td>
                    <td class="col-score">8.0</td>
                </tr>
                <tr>
                    <td class="col-stt">5</td>
                    <td>Nguyễn Văn E</td>
                    <td class="col-score">6.5</td>
                </tr>
                <tr class="average-row">
                    <td colspan="2" style="text-align: right;">Điểm trung bình chung:</td>
                    <td class="col-score">7.84</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
